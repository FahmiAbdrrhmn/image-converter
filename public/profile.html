<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Vectify</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/index.html" class="navbar-brand" style="text-decoration:none;">VECTIFY<span>_</span></a>
    <div class="navbar-menu">
      <span id="nav-username" class="nav-user-link">User</span>
      <span id="nav-tier" class="badge">FREE</span>

      <button class="btn-theme" onclick="toggleTheme()" title="Ganti tema">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </nav>

  <div class="page anim-target">

    <div class="anim-target">
      <h1 class="page-title">Pengaturan Profil</h1>
      <p class="page-sub">Kelola informasi akun Anda.</p>
    </div>

    <!-- Update username -->
    <div class="card anim-target">
      <p class="section-title">Ganti Username</p>
      <div id="msg-update" class="msg"></div>
      <div class="field">
        <label for="new-username">Username baru</label>
        <input type="text" id="new-username" placeholder="Masukkan username baru">
      </div>
      <button class="btn btn-primary" id="btn-update" onclick="doUpdateUsername()">
        <span id="update-text">Simpan Perubahan</span>
      </button>
    </div>

    <!-- Danger zone -->
    <div class="anim-target mt-24">
      <div class="danger-section">
        <p class="danger-title">Zona Berbahaya</p>
        <p class="danger-sub">Hapus akun Anda beserta seluruh data secara permanen. Tindakan ini tidak dapat dibatalkan.</p>
        <button class="btn btn-danger-outline" onclick="doDeleteAccount()">Hapus Akun Permanen</button>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    protectRoute(true);
    const token = localStorage.getItem('token');

    window.onload = async () => {
      try {
        const res  = await fetch('/api/profile', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (!data.success) { logout(); return; }

        const u = data.data;
        document.getElementById('nav-username').textContent   = u.username;
        document.getElementById('nav-tier').textContent       = u.tier.toUpperCase();
        document.getElementById('new-username').value         = u.username;
        document.getElementById('nav-tier').classList.toggle('pro', u.tier === 'pro');
      } catch { showAlert('Gagal memuat profil.'); }
    };

    async function doUpdateUsername() {
      const val  = document.getElementById('new-username').value.trim();
      const btn  = document.getElementById('btn-update');
      const text = document.getElementById('update-text');
      const msg  = document.getElementById('msg-update');

      msg.className = 'msg';
      if (!val) { msg.textContent = 'Username tidak boleh kosong.'; msg.className = 'msg error'; return; }

      btn.disabled   = true;
      text.innerHTML = '<div class="spin"></div> Menyimpan...';

      try {
        const res  = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ newUsername: val })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          msg.textContent = 'Username berhasil diperbarui.';
          msg.className   = 'msg success';
          document.getElementById('nav-username').textContent = data.data.username;
        } else {
          msg.textContent = data.message || 'Gagal memperbarui.';
          msg.className   = 'msg error';
        }
      } catch {
        msg.textContent = 'Tidak dapat menghubungi server.';
        msg.className   = 'msg error';
      } finally {
        btn.disabled  = false;
        text.textContent = 'Simpan Perubahan';
      }
    }

    function doDeleteAccount() {
      showConfirm(
        'Hapus Akun',
        'Seluruh data Anda akan dihapus permanen dan tidak bisa dipulihkan.',
        async () => {
          try {
            const res  = await fetch('/api/profile', {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (res.ok && data.success) { localStorage.removeItem('token'); window.location.href = '/login.html'; }
            else showAlert(data.message || 'Gagal menghapus akun.');
          } catch { showAlert('Tidak dapat menghubungi server.'); }
        },
        true // danger style
      );
    }
  </script>
</body>
</html>
