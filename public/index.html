<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Vectify</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">VECTIFY_</div>
        <div class="navbar-menu">
            <a href="/profile.html" id="nav-username" title="Pengaturan Profil">User</a>
            <span id="nav-tier" class="badge">FREE</span>
            
            <button class="btn-theme" onclick="toggleTheme()" title="Ganti Tema">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>   
            
            <button class="btn-danger" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div class="container">
        <h2>Konverter Vector</h2>
        <p class="text-center">Sisa Kuota: <span id="quota-display">-</span></p>

        <div class="file-area">
            <input type="file" id="imageInput" accept="image/png, image/jpeg">
        </div>

        <button onclick="convertImage()" id="btn-convert">KONVERSI</button>
        <button onclick="upgradePro()" id="btn-upgrade" style="display: none; background: #FFD700; color: #000;">UPGRADE TO PRO</button>

        <div id="result-area" style="display: none;">
            <div id="svg-container"></div>
            <button onclick="downloadSVG()" style="margin-top: 15px;">UNDUH SVG</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="/js/app.js"></script>
    <script>
        protectRoute(true); // Lempar ke login jika tidak ada token

        const token = localStorage.getItem('token');

        // 1. Pisahkan logika ambil profil menjadi fungsi mandiri
        async function loadProfile() {
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const user = data.data;
                    document.getElementById('nav-username').textContent = user.username;
                    document.getElementById('nav-tier').textContent = user.tier;
                    document.getElementById('quota-display').textContent = user.tier === 'pro' ? 'UNLIMITED' : user.quota;

                    if (user.tier === 'pro') {
                        document.getElementById('nav-tier').classList.add('pro');
                        document.getElementById('btn-upgrade').style.display = 'none'; // Sembunyikan tombol upgrade
                    } else {
                        document.getElementById('btn-upgrade').style.display = 'block';
                    }
                } else {
                    logout(); // Token kedaluwarsa
                }
            } catch (e) {
                console.error('Gagal mengambil profil', e);
            }
        }

        // Jalankan fungsi loadProfile saat halaman pertama kali dibuka
        window.onload = loadProfile;

        // 2. Fungsi Konversi (Tanpa Reload Halaman!)
        async function convertImage() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return showAlert('Pilih file gambar (JPG/PNG)!');

            const btn = document.getElementById('btn-convert');
            btn.textContent = 'MEMPROSES...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    const svgText = await res.text();
                    document.getElementById('svg-container').innerHTML = svgText;
                    document.getElementById('result-area').style.display = 'block';
                    
                    // PERBAIKAN: Perbarui teks kuota di background TANPA me-reload halaman
                    loadProfile(); 
                    
                } else {
                    const error = await res.json();
                    showAlert(error.message);
                }
            } catch (e) {
                showAlert('Gagal menghubungi server.');
            } finally {
                btn.textContent = 'EKSEKUSI KONVERSI';
                btn.disabled = false;
            }
        }

        // Fungsi Simpan Gambar
        function downloadSVG() {
            const svgContent = document.getElementById('svg-container').innerHTML;
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Vectify_${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Bersihkan memori browser setelah unduh
        }

        // Fungsi Upgrade
        function upgradePro() {
            // Gunakan custom pop-up showConfirm
            showConfirm(
                'Upgrade ke PRO', 
                'Simulasi: Apakah Anda yakin ingin membayar dan melakukan upgrade ke akun PRO untuk seumur hidup?', 
                async () => {
                    // Blok ini hanya dijalankan jika user klik "Ya, Lanjutkan"
                    const res = await fetch('/api/upgrade', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    
                    if(data.success) {
                        showAlert('Upgrade Berhasil! Selamat datang di layanan PRO.');
                        loadProfile(); 
                    }
                }
            );
        }
    </script>
</body>
</html>
