<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Vectify</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand">VECTIFY<span>_</span></span>
    <div class="navbar-menu">
      <button class="btn-theme" onclick="toggleTheme()" title="Ganti tema">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card anim-target">

      <div class="auth-logo-area">
        <div class="auth-logo-text">VECTIFY<span>_</span></div>
      </div>

      <h1 class="auth-title">Buat akun baru</h1>

      <div id="msg" class="msg"></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Pilih username unik" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter" autocomplete="new-password">
      </div>

      <button class="btn btn-primary mt-8" id="btn-reg" onclick="doRegister()">
        <span id="btn-text">Buat Akun</span>
      </button>
      
            <p class="auth-sub">Sudah punya akun? <a href="/login.html">Masuk di sini</a></p>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    protectRoute(false);

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

    async function doRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-reg');
      const btnText  = document.getElementById('btn-text');
      const msg      = document.getElementById('msg');

      msg.className = 'msg';

      if (!username || !password) {
        msg.textContent = 'Semua kolom wajib diisi.';
        msg.className = 'msg error'; return;
      }
      if (password.length < 6) {
        msg.textContent = 'Password minimal 6 karakter.';
        msg.className = 'msg error'; return;
      }

      btn.disabled = true;
      btnText.innerHTML = '<div class="spin"></div>';

      try {
        const res  = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          msg.textContent = 'Akun berhasil dibuat! Mengalihkan ke halaman login...';
          msg.className   = 'msg success';
          setTimeout(() => window.location.href = '/login.html', 1400);
        } else {
          msg.textContent = data.message || 'Registrasi gagal.';
          msg.className   = 'msg error';
          btn.disabled    = false;
          btnText.textContent = 'Buat Akun';
        }
      } catch {
        msg.textContent = 'Tidak dapat menghubungi server.';
        msg.className   = 'msg error';
        btn.disabled    = false;
        btnText.textContent = 'Buat Akun';
      }
    }
  </script>
</body>
</html>
